name: CI + Docker

on:
  pull_request:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          # requirements.txt has matrix-bot-common as a sibling editable checkout
          grep -v '^-e ' requirements.txt > /tmp/requirements.txt
          pip install -r /tmp/requirements.txt "matrix-bot-common @ https://github.com/OolaaPleur/matrix-element-call-common/archive/refs/heads/master.tar.gz"

      - name: Checks
        run: |
          python -m compileall -q *.py scrobblers
          python -c "import bot, commands, event_handler, linking, play_tracker, storage, scrobblers.lastfm"

  docker:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Lowercase repository
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Get version from Git tag
        id: get_tag
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}:${{ steps.get_tag.outputs.version }}
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
