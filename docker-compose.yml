services:
  scrobbler:
    # The image CI publishes for every push to master. To build from this
    # checkout instead (e.g. with your own changes), uncomment `build` and run
    # `docker compose up -d --build`.
    image: ghcr.io/oolaapleur/matrix-element-call-scrobbler:latest
    # build: .
    container_name: scrobbler
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro,Z   # Z: SELinux label (Fedora/RHEL); ignored elsewhere
      - scrobbler_logs:/app/logs
      - scrobbler_data:/app/data

# Fixed names: the same whatever the clone's folder is called (compose would
# otherwise prefix them with it), and what the README calls them.
volumes:
  scrobbler_logs:
    name: scrobbler_logs
  scrobbler_data:
    name: scrobbler_data
